name: CI

on:
  pull_request:
    branches:
      - dev
      - master
      - 'release/*'
  push:
    branches:
      - dev
      - master
      - 'release/*'

jobs:
  test:
    name: Test (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ benchmarks/regression_tests.py
